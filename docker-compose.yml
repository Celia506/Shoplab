# =============================================================================
# ShopLab - environnement local reproductible
# Demarrage : docker compose up -d
# Arret     : docker compose down        (les donnees sont conservees)
# Remise a zero complete : docker compose down -v && docker compose up -d
# =============================================================================
name: shoplab

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoplab}
      POSTGRES_DB: ${POSTGRES_DB:-shoplab}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data          # donnees persistantes
      - ./db/init:/docker-entrypoint-initdb.d:ro  # schema + seed au premier demarrage
      - ./snapshots:/snapshots                    # echange des sauvegardes avec l'hote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoplab} -d ${POSTGRES_DB:-shoplab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    image: shoplab-api:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-shoplab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shoplab}
      DB_NAME: ${POSTGRES_DB:-shoplab}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Interface web d'administration de la base (optionnelle, alternative a DBeaver)
  # Demarrage : docker compose --profile outils up -d
  adminer:
    image: adminer:4.8.1
    profiles: ["outils"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  pgdata:
