<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLab</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
    header { padding: 16px 24px; color: #fff; background: #2f5d8a; display: flex; justify-content: space-between; align-items: center; }
    header.env-recette { background: #b7791f; }
    header.env-preprod { background: #9b2c2c; }
    header.env-test { background: #2f855a; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    section { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
    td.num { text-align: right; }
    input, button { font: inherit; padding: 6px 10px; }
    pre { background: #f1f3f5; padding: 12px; overflow: auto; font-size: 13px; }
    .badge { font-size: 13px; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 12px; }
  </style>
</head>
<body>
  <header id="bandeau">
    <strong>ShopLab</strong>
    <span class="badge" id="version">chargement...</span>
  </header>
  <main>
    <section>
      <h2>Rechercher une commande</h2>
      <form id="recherche">
        <input id="numero" placeholder="CMD-2026-00001" required>
        <button type="submit">Afficher</button>
      </form>
      <pre id="commande" hidden></pre>
    </section>
    <section>
      <h2>Catalogue</h2>
      <table>
        <thead><tr><th>Reference</th><th>Produit</th><th>Categorie</th><th class="num">Prix TTC</th><th class="num">Stock</th></tr></thead>
        <tbody id="produits"></tbody>
      </table>
    </section>
  </main>
  <script>
    fetch('/api/version').then(r => r.json()).then(v => {
      document.getElementById('version').textContent = `v${v.version} - ${v.environnement}`;
      document.getElementById('bandeau').classList.add('env-' + v.environnement);
    });
    fetch('/api/produits').then(r => r.json()).then(list => {
      document.getElementById('produits').innerHTML = list.map(p =>
        `<tr><td>${p.reference}</td><td>${p.nom}</td><td>${p.categorie}</td><td class="num">${Number(p.prix_ttc).toFixed(2)} EUR</td><td class="num">${p.stock}</td></tr>`).join('');
    });
    document.getElementById('recherche').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/commandes/' + encodeURIComponent(document.getElementById('numero').value.trim()));
      const out = document.getElementById('commande');
      out.hidden = false;
      out.textContent = JSON.stringify(await r.json(), null, 2);
    });
  </script>
</body>
</html>
